<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="snrdlr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>snrdlr</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // A copy of this page from before the last deploy names scripts the server no longer has, and
      // would stay blank. If the app's script cannot be loaded, load the page again, once.
      addEventListener(
        'error',
        event => {
          if (!(event.target instanceof HTMLScriptElement)) return
          try {
            if (sessionStorage.getItem('snrdlr.scriptReload')) return
            sessionStorage.setItem('snrdlr.scriptReload', '1')
          } catch {
            return
          }
          location.reload()
        },
        true
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
